version: 2

models:
  - name: mart_product_verdicts
    description: "Primary serving table in gold schema for search, radar feed, and product headers."
    columns:
      - name: product_sk
        description: "Primary key (MD5 surrogate key of store_name + external_id)."
        tests:
          - unique
          - not_null
      - name: store_name
        tests:
          - not_null
      - name: category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['electronics', 'fashion']
      - name: sub_category
        tests:
          - not_null
      - name: brand
        tests:
          - not_null
      - name: product_title
        tests:
          - not_null
      - name: product_url
        tests:
          - not_null
      - name: current_price
        tests:
          - not_null
      - name: rolling_60d_median
        tests:
          - not_null
      - name: min_historical_price
        tests:
          - not_null
      - name: max_historical_price
        tests:
          - not_null
      - name: claimed_discount_pct
        tests:
          - not_null
      - name: real_discount_pct
        tests:
          - not_null
      - name: discount_verdict
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 'ALL_TIME_LOW'
                  - 'GENUINE_DEAL'
                  - 'FAKE_DISCOUNT'
                  - 'PRESALE_HIKE'
                  - 'NORMAL_PRICE'
      - name: scarcity_flag
        tests:
          - not_null
      - name: in_stock
        tests:
          - not_null
      - name: last_updated_at
        tests:
          - not_null

  - name: fct_price_history
    description: "Daily price history time-series in gold schema with rolling 60-day median."
    columns:
      - name: product_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mart_product_verdicts')
                field: product_sk
      - name: snapshot_date
        tests:
          - not_null
      - name: price
        tests:
          - not_null
      - name: rolling_60d_median
        tests:
          - not_null
      - name: in_stock
        tests:
          - not_null

  - name: mart_cross_store_matches
    description: "Cross-store arbitrage comparison in gold schema for products carried by >= 2 stores."
    columns:
      - name: canonical_product_key
        tests:
          - unique
          - not_null
      - name: product_title_clean
        tests:
          - not_null
      - name: category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['electronics', 'fashion']
      - name: brand
        tests:
          - not_null
      - name: stores_count
        tests:
          - not_null
      - name: lowest_price
        tests:
          - not_null
      - name: lowest_price_store
        tests:
          - not_null
      - name: highest_price
        tests:
          - not_null
      - name: price_spread_egp
        tests:
          - not_null
      - name: price_spread_pct
        tests:
          - not_null
      - name: listings_json
        tests:
          - not_null
