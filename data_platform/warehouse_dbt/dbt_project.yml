name: 'price_truth_radar'
version: '1.0.0'
config-version: 2

profile: 'price_truth_radar'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  price_truth_radar:
    staging:
      +schema: silver
      +materialized: view
    marts:
      +schema: gold
      +materialized: table
      +grants:
        select: ['add_readonly']
      +post-hook:
        - "GRANT USAGE ON SCHEMA gold TO add_readonly"
        - "GRANT SELECT ON {{ this }} TO add_readonly"

on-run-end:
  - "GRANT USAGE ON SCHEMA gold TO add_readonly"
  - "GRANT SELECT ON ALL TABLES IN SCHEMA gold TO add_readonly"
