name: Price Drop Alert Checker

on:
  schedule:
    # Runs once daily at 01:45 UTC (tail of the single 00:53 UTC daily pipeline window —
    # prices refresh once daily, so no second afternoon Neon wakeup is needed).
    - cron: '45 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate alerts in dry-run mode without sending notifications"
        required: false
        default: false
        type: boolean
      test_email:
        description: "Optional: send ONE real test email through the configured provider (no DB writes) and skip the alert check"
        required: false
        default: ""
        type: string

jobs:
  check-alerts:
    name: Check Active Price Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
      # Email: Resend is tried first, then SMTP. Blank secrets are treated as unset.
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r web_app/backend/requirements.txt

      - name: Optional provider test send (no database writes)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email != '' }}
        env:
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python web_app/backend/jobs/send_test_notification.py --to "$TEST_EMAIL" $EXTRA_ARGS

      - name: Run price drop alert checker
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_email == '' }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python web_app/backend/jobs/check_price_alerts.py $EXTRA_ARGS
