name: Daily Fashion & Footwear Pipeline

on:
  # Consolidated into daily-stores-matrix.yml (single 00:53 UTC Neon compute window covers
  # all 8 fashion stores + match + dbt + 3-day prune). Keep manual dispatch for targeted runs.
  workflow_dispatch:

jobs:
  scrape-fashion:
    name: Scrape Fashion (${{ matrix.store }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store:
          - town_team
          - dejavu
          - dalydress
          - activ
          - carina
          - khotwh
          - concrete
          - mobaco

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data platform dependencies
        run: pip install -r data_platform/requirements.txt

      - name: Run live fashion scraper (${{ matrix.store }})
        continue-on-error: true
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: python data_platform/ingestion/scrapers/run_scrapers.py --store ${{ matrix.store }} --vertical fashion --mode daily --delta

  match-and-dbt:
    name: Match Cross-Store & Run dbt
    runs-on: ubuntu-latest
    needs: scrape-fashion
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data platform dependencies
        run: pip install -r data_platform/requirements.txt

      - name: Run DB-level cross-store canonical matching
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: python data_platform/ingestion/scrapers/run_scrapers.py --match-db

      - name: Run dbt models and data tests
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: |
          python data_platform/run_dbt.py run
          python data_platform/run_dbt.py test
