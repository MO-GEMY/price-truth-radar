name: Daily Core Electronics & Appliances Pipeline

on:
  schedule:
    # Off-peak daily run at 00:37 UTC (02:37 AM Cairo EET / 03:37 AM EEST)
    - cron: '37 0 * * *'
  workflow_dispatch:

jobs:
  scrape-core:
    name: Scrape Core (${{ matrix.store }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Note: `2b` and `sigma` block cloud/datacenter IPs and run locally via scripts/run_local_scrapers.ps1
        # Fashion stores run in fashion-daily.yml; Grocery stores run in groceries-daily.yml
        store:
          - btech
          - noon
          - amazon_eg
          - raneen
          - rayashop
          - compumarts
          - tradeline
          - elaraby
          - elbadr
          - compuscience
          - cairosales
          - egyptlaptop
          - dubaiphone

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data platform dependencies
        run: pip install -r data_platform/requirements.txt

      - name: Run live core scraper (${{ matrix.store }} - daily)
        continue-on-error: true
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: python data_platform/ingestion/scrapers/run_scrapers.py --store ${{ matrix.store }} --vertical core --mode daily --delta

  match-and-dbt:
    name: Match Cross-Store & Run dbt
    runs-on: ubuntu-latest
    needs: scrape-core
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data platform dependencies
        run: pip install -r data_platform/requirements.txt

      - name: Run DB-level cross-store canonical matching
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: python data_platform/ingestion/scrapers/run_scrapers.py --match-db

      - name: Run dbt models and data tests
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: |
          python data_platform/run_dbt.py run
          python data_platform/run_dbt.py test
