name: Daily Stores Batch Matrix (Offline Tiered Pipeline)

on:
  schedule:
    # Off-peak UTC slot (03:17 UTC = 05:17 AM Cairo EET / 06:17 AM EEST) to avoid GitHub
    # Actions UTC midnight cron starvation:
    #   - Sun-Fri: daily refresh of Tier-1 (Priority 1 Major Brands + Priority 2 Major Stores)
    #              + rotated Tier-2 (every 3 days) + rotated Tier-3 (every 5 days)
    #   - Saturday: deep discovery sweep across scheduled tiered shards in the same single window
    # Neon stays 100% SUSPENDED (0 CU) during ALL HTTP scraping; opens ONCE at the end for COPY + dbt + TRUNCATE.
    - cron: '17 3 * * 0-5'
    - cron: '17 3 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        description: "Scrape mode ('daily', 'discover', or 'expand')"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - discover
          - expand
      priority_filter:
        description: "Priority slice ('all', 'p1', 'p2', 'p1_p2', 'p3', or comma-separated store keys)"
        required: false
        default: "all"
        type: string
      all_tiers:
        description: "Include ALL Tier-2 & Tier-3 stores today instead of day-of-year modulo rotation"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Dry-run offline scrape + circuit-breaker preview (zero Neon writes)"
        required: false
        default: false
        type: boolean

concurrency:
  group: stores-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan-waves:
    name: Plan Deterministic Tiered Waves (Zero-DB)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      has_shards: ${{ steps.plan.outputs.has_shards }}
      mode: ${{ steps.plan.outputs.mode }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data platform dependencies
        run: pip install -r data_platform/requirements.txt

      - name: Build strict Priority 1 -> 2 -> 3 shard plan (Zero Neon connection)
        id: plan
        env:
          PRIORITY_FILTER: ${{ github.event.inputs.priority_filter || 'all' }}
          ALL_TIERS: ${{ github.event.inputs.all_tiers || 'false' }}
          INPUT_MODE: ${{ github.event.inputs.mode || '' }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
        run: |
          EXTRA=""
          if [ "$ALL_TIERS" = "true" ]; then
            EXTRA="--all-tiers"
          fi
          python scripts/offline_tiered_pipeline.py plan \
            --filter "$PRIORITY_FILTER" \
            --tier2-cadence 3 \
            --tier3-cadence 5 \
            $EXTRA \
            --github-output "$GITHUB_OUTPUT"

          python - <<'PY'
          import os
          dispatch_mode = os.environ.get("INPUT_MODE", "").strip().lower()
          schedule_expr = os.environ.get("EVENT_SCHEDULE", "").strip()
          if dispatch_mode in ("daily", "discover", "expand"):
              mode = dispatch_mode
          elif schedule_expr == "17 3 * * 6":
              mode = "discover"
          else:
              mode = "daily"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"mode={mode}\n")
          print(f"Resolved scrape mode: {mode}")
          PY

  scrape-offline:
    name: Offline Scrape (${{ matrix.shard.shard }} - ${{ needs.plan-waves.outputs.mode }})
    runs-on: ubuntu-latest
    needs: plan-waves
    if: needs.plan-waves.outputs.has_shards == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan-waves.outputs.shards) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data platform dependencies
        run: pip install -r data_platform/requirements.txt

      - name: Run 100% offline shard scraper (ZERO Neon connection / 0 CU)
        continue-on-error: true
        env:
          # Explicitly empty — Neon MUST stay suspended during all HTTP scraping
          DATABASE_URL: ""
          DATABASE_URL_ADMIN: ""
          DATABASE_URL_READONLY: ""
          MODE_INPUT: ${{ needs.plan-waves.outputs.mode }}
          SHARD_NAME: ${{ matrix.shard.shard }}
          SHARD_PRIORITY: ${{ matrix.shard.priority }}
          SHARD_STORES: ${{ join(matrix.shard.stores, ',') }}
        run: |
          mkdir -p staging
          python scripts/offline_tiered_pipeline.py scrape-shard \
            --shard "$SHARD_NAME" \
            --priority "$SHARD_PRIORITY" \
            --stores "$SHARD_STORES" \
            --mode "$MODE_INPUT" \
            --workers 4 \
            --out "staging/${SHARD_NAME}.jsonl.gz"

      - name: Upload compact gzipped JSONL shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-shard-${{ matrix.shard.shard }}
          path: staging/
          retention-days: 1
          if-no-files-found: ignore

  load-match-dbt:
    name: Single-Session Neon COPY, Match, dbt & Zero-Rest TRUNCATE
    runs-on: ubuntu-latest
    needs: [plan-waves, scrape-offline]
    if: always() && needs.plan-waves.outputs.has_shards == 'true'
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data platform dependencies
        run: pip install -r data_platform/requirements.txt

      - name: Download all offline JSONL shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: offline-shard-*
          path: staging_artifacts
          merge-multiple: true

      - name: Circuit-breaker -> Bulk COPY (P1 -> P2 -> P3) -> dbt -> Match -> TRUNCATE raw -> Alerts
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          EXTRA=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            EXTRA="--dry-run"
          else
            EXTRA="--run-alerts"
          fi
          python scripts/offline_tiered_pipeline.py load-and-transform \
            --artifacts-dir staging_artifacts \
            --warn-mb 900 \
            --stop-mb 950 \
            --soft-exit-on-stop \
            $EXTRA
