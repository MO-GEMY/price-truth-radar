name: Catalog Discovery Pipeline (Twice-Weekly)

on:
  schedule:
    # Runs every Tuesday & Friday at 01:13 UTC (03:13 AM Cairo EET / 04:13 AM EEST)
    - cron: '13 1 * * 2,5'
  workflow_dispatch:
    inputs:
      store:
        description: "Optional store filter (single slug or comma-separated, e.g. 'noon' or 'spinneys,hyperone'; blank = all cloud stores)"
        required: false
        default: ""
        type: string
      vertical:
        description: "Optional vertical filter"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - core
          - fashion
          - groceries
      limit:
        description: "Optional per-store product limit override (blank = each store's discovery target)"
        required: false
        default: ""
        type: string

jobs:
  plan:
    name: Build Discovery Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      has_targets: ${{ steps.build.outputs.has_targets }}

    steps:
      - name: Filter cloud discovery targets
        id: build
        env:
          INPUT_STORE: ${{ github.event.inputs.store || '' }}
          INPUT_VERTICAL: ${{ github.event.inputs.vertical || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          # Note: `2b` and `sigma` block cloud/datacenter IPs and run locally via
          # `scripts/run_local_scrapers.ps1 -Discovery` from Egypt residential IP.
          ALL_TARGETS = [
              # Core Electronics & Home Appliances (13 cloud stores)
              {"store": "btech", "vertical": "core"},
              {"store": "noon", "vertical": "core"},
              {"store": "amazon_eg", "vertical": "core"},
              {"store": "raneen", "vertical": "core"},
              {"store": "rayashop", "vertical": "core"},
              {"store": "compumarts", "vertical": "core"},
              {"store": "tradeline", "vertical": "core"},
              {"store": "elaraby", "vertical": "core"},
              {"store": "elbadr", "vertical": "core"},
              {"store": "compuscience", "vertical": "core"},
              {"store": "cairosales", "vertical": "core"},
              {"store": "egyptlaptop", "vertical": "core"},
              {"store": "dubaiphone", "vertical": "core"},
              # Fashion & Footwear (8 cloud stores)
              {"store": "town_team", "vertical": "fashion"},
              {"store": "dejavu", "vertical": "fashion"},
              {"store": "dalydress", "vertical": "fashion"},
              {"store": "activ", "vertical": "fashion"},
              {"store": "carina", "vertical": "fashion"},
              {"store": "khotwh", "vertical": "fashion"},
              {"store": "concrete", "vertical": "fashion"},
              {"store": "mobaco", "vertical": "fashion"},
              # Groceries & Supermarkets (9 cloud stores)
              {"store": "amazon_eg", "vertical": "groceries"},
              {"store": "noon", "vertical": "groceries"},
              {"store": "spinneys", "vertical": "groceries"},
              {"store": "hyperone", "vertical": "groceries"},
              {"store": "seoudi", "vertical": "groceries"},
              {"store": "abu_auf", "vertical": "groceries"},
              {"store": "gourmet", "vertical": "groceries"},
              {"store": "imtenan", "vertical": "groceries"},
              {"store": "metro_market", "vertical": "groceries"},
          ]

          raw_stores = os.environ.get("INPUT_STORE", "").strip()
          store_filter = {s.strip().lower() for s in raw_stores.split(",") if s.strip()}
          vertical_filter = os.environ.get("INPUT_VERTICAL", "all").strip().lower() or "all"

          selected = [
              t for t in ALL_TARGETS
              if (not store_filter or t["store"] in store_filter)
              and (vertical_filter == "all" or t["vertical"] == vertical_filter)
          ]

          print(f"Selected {len(selected)} discovery targets (store_filter={sorted(store_filter)}, vertical={vertical_filter})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps({'target': selected})}\n")
              fh.write(f"has_targets={'true' if selected else 'false'}\n")
          PY

  discover:
    name: Discover (${{ matrix.target.store }} - ${{ matrix.target.vertical }})
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data platform dependencies
        run: pip install -r data_platform/requirements.txt

      - name: Run catalog discovery (${{ matrix.target.store }} - ${{ matrix.target.vertical }})
        continue-on-error: true
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
          LIMIT_OVERRIDE: ${{ github.event.inputs.limit || '' }}
        run: |
          LIMIT_ARGS=""
          if [ -n "$LIMIT_OVERRIDE" ]; then
            LIMIT_ARGS="--limit $LIMIT_OVERRIDE"
          fi
          python data_platform/ingestion/scrapers/run_scrapers.py \
            --store "${{ matrix.target.store }}" \
            --vertical "${{ matrix.target.vertical }}" \
            --mode discovery \
            $LIMIT_ARGS

  match-and-dbt:
    name: Match Cross-Store & Run dbt
    runs-on: ubuntu-latest
    needs: [plan, discover]
    if: always() && needs.plan.outputs.has_targets == 'true'
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install data platform dependencies
        run: pip install -r data_platform/requirements.txt

      - name: Run DB-level cross-store canonical matching
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: python data_platform/ingestion/scrapers/run_scrapers.py --match-db

      - name: Run dbt snapshot, models, and data tests
        env:
          DATABASE_URL_ADMIN: ${{ secrets.DATABASE_URL_ADMIN }}
        run: |
          python data_platform/run_dbt.py snapshot
          python data_platform/run_dbt.py run
          python data_platform/run_dbt.py test
