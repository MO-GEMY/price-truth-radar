<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أسعارك | Asarak — Facebook Page Cover · 1640×924</title>
<link rel="stylesheet" href="brand.css">
<style>
/* 820 × 462 CSS px · deviceScaleFactor 2 → 1640 × 924 px
   Safe area 1280×624 px = CSS (90,75) → (730,387). Content is inset a further 40 px.
   Both bottom corners are kept clear for the page avatar: no foreground below y = 320. */
.asset{width:820px;height:462px}
.url{position:absolute;left:130px;top:112px;--url:14px}
.price-stack{position:absolute;left:130px;top:162px}
.lockup{position:absolute;right:130px;top:112px;--lk-e:56px}
.headline{position:absolute;right:130px;top:170px;--hl:42px;line-height:1.25;text-align:start;margin:0}
.pills{position:absolute;right:130px;top:283px;--pl:12.5px}

</style>
</head>
<body>
<div class="asset">

  <!-- ── Radar background (decorative, full-bleed) ─────────────────────── -->
  <div class="bg" aria-hidden="true">
    <div class="bg__base"></div>
    <div class="bg__grid" style="--cell:38px;--gx:58%;--gy:48%;--gm:66% 82%"></div>
    <div class="bg__glow" style="--gx:76%;--gy:0%;--gs:62% 78%;--ga:rgba(12,174,121,.17)"></div>
    <div class="bg__glow" style="--gx:2%;--gy:108%;--gs:48% 64%;--ga:rgba(12,174,121,.12)"></div>
    <div class="layer fade-x">
      <div class="radar-set" style="--cx:206px;--cy:206px">
        <i style="--r:94px;--o:.20"></i><i style="--r:170px;--o:.15"></i><i style="--r:246px;--o:.11"></i><i style="--r:322px;--o:.07"></i>
      </div>
      <div class="sweep" style="--cx:206px;--cy:206px;--r:246px"></div>
      <span class="blip" style="--x:272px;--y:119px"></span>
        <span class="blip" style="--x:76px;--y:77px"></span>
    </div>
  </div>

  <!-- ── Foreground (all inside the safe area) ─────────────────────────── -->
  <div class="fg">
    <span class="url" dir="ltr">asarak.com</span>

    <div class="price-stack">
      <span class="price-chip price-chip--low"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 6.2 4.8 9 10 3.2" fill="none" stroke="#0B192E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>أقل سعر · 54,999 ج.م</span>
      <span class="price-chip"><span class="dot"></span>58,999 ج.م</span>
      <span class="price-chip"><span class="dot"></span>64,200 ج.م</span>
    </div>

    <div class="lockup">
      <span class="emblem emblem--white" role="img" aria-label="Asarak"></span>
      <span class="wordmark"><span class="wordmark-ar">أسعارك</span><span class="wordmark-en" dir="ltr">Asarak</span></span>
    </div>

    <h1 class="headline">قارن <span class="hl">السعر الحقيقي</span><br>قبل ما تشتري</h1>

    <div class="pills">
      <span class="pill"><b class="num">+200</b> متجر مصري</span>
      <span class="pill"><b class="num">+265</b> ألف منتج</span>
      <span class="pill">مقارنة فورية للأسعار</span>
    </div>
  </div>
</div>
</body>
</html>
