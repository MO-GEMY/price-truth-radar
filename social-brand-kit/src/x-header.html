<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أسعارك | Asarak — X (Twitter) Header · 1500×500</title>
<link rel="stylesheet" href="brand.css">
<style>
/* 750 × 250 CSS px · deviceScaleFactor 2 → 1500 × 500 px
   Keep-clear zone: X draws the profile photo over the bottom-left ~420×220 px
   → CSS x < 210 · y > 140. Nothing but background lives there. */
.asset{width:750px;height:250px}
.url{position:absolute;left:32px;top:30px;--url:13px}
.price-stack{position:absolute;left:32px;top:70px}
.lockup{position:absolute;right:32px;top:30px;--lk-e:40px}
.headline{position:absolute;right:32px;top:78px;--hl:36px;line-height:1.25;text-align:start;margin:0}
.pills{position:absolute;right:32px;top:180px;--pl:10.5px;gap:7px}
.price-chip{font-size:12px;padding:7px 12px}
.price-chip--low{font-size:12.5px}
.fade-x{--f0:32%;--f1:58%}
</style>
</head>
<body>
<div class="asset">

  <!-- ── Radar background (decorative) ────────────────────────────────── -->
  <div class="bg" aria-hidden="true">
    <div class="bg__base"></div>
    <div class="bg__grid" style="--cell:31px;--gx:66%;--gy:42%;--gm:78% 100%"></div>
    <div class="bg__glow" style="--gx:84%;--gy:0%;--gs:62% 100%;--ga:rgba(12,174,121,.17)"></div>
    <div class="layer fade-x">
      <div class="radar-set" style="--cx:112px;--cy:96px">
        <i style="--r:50px;--o:.20"></i><i style="--r:104px;--o:.15"></i><i style="--r:158px;--o:.11"></i><i style="--r:212px;--o:.07"></i>
      </div>
      <div class="sweep" style="--cx:112px;--cy:96px;--r:158px"></div>
      <span class="blip" style="--x:262px;--y:150px"></span>
      <span class="blip" style="--x:214px;--y:52px"></span>
    </div>
  </div>

  <!-- ── Foreground ────────────────────────────────────────────────────── -->
  <div class="fg">
    <span class="url" dir="ltr">asarak.com</span>

    <div class="price-stack">
      <span class="price-chip price-chip--low"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2 6.2 4.8 9 10 3.2" fill="none" stroke="#0B192E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>54,999 ج.م</span>
      <span class="price-chip"><span class="dot"></span>58,999 ج.م</span>
    </div>

    <div class="lockup">
      <span class="emblem emblem--white" role="img" aria-label="Asarak"></span>
      <span class="wordmark"><span class="wordmark-ar">أسعارك</span><span class="wordmark-en" dir="ltr">Asarak</span></span>
    </div>

    <h1 class="headline">قارن <span class="hl">السعر الحقيقي</span><br>قبل ما تشتري</h1>

    <div class="pills">
      <span class="pill"><b class="num">+200</b> متجر مصري</span>
      <span class="pill"><b class="num">+265</b> ألف منتج</span>
      <span class="pill">مقارنة فورية للأسعار</span>
    </div>
  </div>
</div>
</body>
</html>
