<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أسعارك | Asarak — LinkedIn Company Page Cover · 2256×382</title>
<link rel="stylesheet" href="brand.css">
<style>
/* 1128 × 191 CSS px · deviceScaleFactor 2 → 2256 × 382 px (2× retina of 1128×191)
   Keep-clear zone: LinkedIn overlaps the square company logo on the bottom-left
   → CSS x < 220 · y > 81. The composition is anchored to the right (RTL). */
.asset{width:1128px;height:191px}
.lockup{position:absolute;right:64px;top:34px;--lk-e:60px}
.headline{position:absolute;right:305px;top:28px;--hl:44px;line-height:1.2;text-align:start;margin:0;white-space:nowrap}
.row2{position:absolute;right:64px;top:128px;display:flex;align-items:center;gap:12px}
.pills{--pl:12.5px;gap:9px}
.url{--url:13px}
.fade-x{--f0:46%;--f1:64%}
</style>
</head>
<body>
<div class="asset">

  <!-- ── Radar background (decorative) ────────────────────────────────── -->
  <div class="bg" aria-hidden="true">
    <div class="bg__base"></div>
    <div class="bg__grid" style="--cell:30px;--gx:62%;--gy:50%;--gm:72% 130%"></div>
    <div class="bg__glow" style="--gx:88%;--gy:0%;--gs:52% 150%;--ga:rgba(12,174,121,.16)"></div>
    <div class="layer fade-x">
      <div class="radar-set" style="--cx:150px;--cy:96px">
        <i style="--r:58px;--o:.20"></i><i style="--r:116px;--o:.15"></i><i style="--r:174px;--o:.11"></i><i style="--r:232px;--o:.08"></i><i style="--r:290px;--o:.05"></i>
      </div>
      <div class="sweep" style="--cx:150px;--cy:96px;--r:232px"></div>
      <span class="blip" style="--x:56px;--y:27px"></span>
      <span class="blip" style="--x:244px;--y:29px"></span>
      <span class="blip" style="--x:258px;--y:166px"></span>
    </div>
  </div>

  <!-- ── Foreground: right-anchored corporate layout ───────────────────── -->
  <div class="fg">
    <div class="lockup">
      <span class="emblem emblem--white" role="img" aria-label="Asarak"></span>
      <span class="wordmark"><span class="wordmark-ar">أسعارك</span><span class="wordmark-en" dir="ltr">Asarak</span></span>
    </div>

    <h1 class="headline">قارن <span class="hl">السعر الحقيقي</span> قبل ما تشتري</h1>

    <div class="row2">
      <div class="pills">
        <span class="pill"><b class="num">+200</b> متجر مصري</span>
        <span class="pill"><b class="num">+265</b> ألف منتج</span>
        <span class="pill">مقارنة فورية للأسعار</span>
      </div>
      <span class="url" dir="ltr">asarak.com</span>
    </div>
  </div>
</div>
</body>
</html>
